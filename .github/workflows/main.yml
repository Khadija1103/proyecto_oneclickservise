name: Deploy One Click Service

on:
  push:
    branches:
      - tatianamarrugo

jobs:

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Backend
        working-directory: backend/OneClickServiceBackend
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon


  deploy-backend:
    name: Deploy Backend
    needs: build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        working-directory: backend/OneClickServiceBackend
        run: |
          docker build -t oneclickservice-backend .

      - name: Push Docker Image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY=$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

          docker tag oneclickservice-backend:latest $REGISTRY/oneclickservice-backend:latest

          docker push $REGISTRY/oneclickservice-backend:latest


  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Frontend
        run: |
          echo "Frontend listo para despliegue"
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Rama: $GITHUB_REF_NAME"
