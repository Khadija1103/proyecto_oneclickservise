name: Deploy OneClick Service Backend

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Dar permisos a Gradle
        run: chmod +x backend/OneClickServiceBackend/gradlew

      - name: Construir Backend
        working-directory: backend/OneClickServiceBackend
        run: ./gradlew build -x test
