<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registrarse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../estilos-css/registro.css">

</head>

<body>

<div class="registro-card">

<div class="volver-container">
<a href="login.html" class="btn-volver">
<i class="bi bi-arrow-left-circle"></i> Volver
</a>
</div>


<div class="logo-registro">
<img src="../assets/img/logo.png" alt="Logo">
</div>


<h2>Registrarse</h2>


<form id="formulario">


<div class="mb-3">

<label class="form-label fw-bold">
Nombre
</label>

<input 
type="text"
id="nombres"
class="form-control"
placeholder="Ingrese su nombre"
maxlength="30"
required>

<div id="error-nombres" class="mensaje-error"></div>

</div>



<div class="mb-3">

<label class="form-label fw-bold">
Apellidos
</label>

<input 
type="text"
id="apellidos"
class="form-control"
placeholder="Ingrese sus apellidos"
maxlength="30"
required>

<div id="error-apellidos" class="mensaje-error"></div>

</div>




<div class="mb-3">

<label class="form-label fw-bold">
Correo
</label>

<input 
type="email"
id="correo"
class="form-control"
placeholder="correo@ejemplo.com"
required>

<div id="error-correo" class="mensaje-error"></div>

</div>




<div class="mb-3">

<label class="form-label fw-bold">
Documento
</label>

<input 
type="text"
id="documento"
class="form-control"
placeholder="Número de documento"
maxlength="15"
required>

<div id="error-documento" class="mensaje-error"></div>

</div>




<div class="mb-3">

<label class="form-label fw-bold">
Ciudad
</label>

<input 
type="text"
id="ciudad"
class="form-control"
placeholder="Ingrese ciudad">

</div>





<div class="mb-3">

<label class="form-label fw-bold">
Contraseña
</label>

<input 
type="password"
id="password"
class="form-control"
placeholder="Ejemplo: Tatiana123*"
required>

<div id="error-password" class="mensaje-error"></div>

</div>





<div class="mb-3">

<label class="form-label fw-bold">
Confirmar contraseña
</label>

<input 
type="password"
id="confirmPassword"
class="form-control"
placeholder="Repita contraseña"
required>

<div id="error-confirmPassword" class="mensaje-error"></div>

</div>





<div class="form-check mb-3">

<input 
class="form-check-input"
type="checkbox"
id="terminos">

<label class="form-check-label">

Acepto términos y condiciones

</label>


<div id="error-terminos" class="mensaje-error"></div>

</div>





<button 
type="submit"
id="btnRegistrar"
class="btn-registro">

<i class="bi bi-person-plus"></i>
Registrarse

</button>


</form>



<div class="login-link">

¿Ya tienes cuenta?

<a href="login.html">
Inicia Sesión
</a>

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/registro.js"></script>


</body>
</html>
