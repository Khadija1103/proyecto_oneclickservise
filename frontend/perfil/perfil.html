<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Perfil | One Click Service</title>

    <link rel="stylesheet" href="perfil.css">

</head>

<body>

    <div id="navbar"></div>

    <main class="perfil-container">

        <!-- ===================================================== -->
        <!-- CABECERA -->
        <!-- ===================================================== -->

        <section class="perfil-header">

            <div class="foto-container">

                <img
                    id="fotoPerfil"
                    src="../assets/img/logo.png"
                    alt="Foto de perfil">

                <label
                    for="inputFoto"
                    class="btn-foto">

                    Cambiar foto

                </label>

                <input
                    type="file"
                    id="inputFoto"
                    accept="image/*"
                    hidden>

            </div>


            <div class="datos-principales">

                <h1 id="nombreUsuario">
                    Usuario One Click
                </h1>

                <span
                    id="rolBadge"
                    class="rol">

                    CLIENTE

                </span>

                <p id="descripcionRol">
                    Gestiona tu información personal y servicios.
                </p>

            </div>

        </section>



        <!-- ===================================================== -->
        <!-- INFORMACIÓN PERSONAL -->
        <!-- ===================================================== -->

        <section class="card-perfil">

            <h2>
                Información Personal
            </h2>

            <form id="formPerfil">

                <div class="info-grid">

                    <div>

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre">

                    </div>


                    <div>

                        <label for="apellido">
                            Apellido
                        </label>

                        <input
                            type="text"
                            id="apellido">

                    </div>


                    <div>

                        <label for="correo">
                            Correo
                        </label>

                        <input
                            type="email"
                            id="correo"
                            readonly>

                    </div>


                    <div>

                        <label for="telefono">
                            Teléfono
                        </label>

                        <input
                            type="text"
                            id="telefono">

                    </div>


                    <div>

                        <label for="rol">
                            Rol
                        </label>

                        <input
                            type="text"
                            id="rol"
                            readonly>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn-editar">

                    Guardar cambios

                </button>

            </form>

        </section>



        <!-- ===================================================== -->
        <!-- MIS SOLICITUDES -->
        <!-- ===================================================== -->

        <section
            id="seccionSolicitudes"
            class="card-perfil">

            <h2>
                Mis solicitudes
            </h2>

            <div id="listaServicios">

                <p>
                    No tienes solicitudes registradas.
                </p>

            </div>

        </section>



        <!-- ===================================================== -->
        <!-- ACCIONES -->
        <!-- ===================================================== -->

        <section
            id="accionesCliente"
            class="acciones">

            <button
                id="btnSolicitar"
                class="btn-principal">

                Solicitar servicio

            </button>


            <button
                id="btnCerrar"
                class="btn-secundario">

                Cerrar sesión

            </button>

        </section>

    </main>



    <div id="footer"></div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/cargarNavbar.js"></script>

    <script src="perfil.js"></script>

    <script src="../js/footer.js"></script>

</body>

</html>
